plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'host.exp.exponent'
version = '1.0.0'

android {
  namespace 'expo.modules.smartcapture'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.12.0'
  // Bundled Latin text recognition model — runs fully offline, no Play Services download.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
